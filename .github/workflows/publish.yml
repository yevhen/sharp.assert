name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Restore dependencies
      run: dotnet restore SharpAssert.sln
    
    - name: Build
      run: dotnet build SharpAssert.sln --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}
    
    - name: Run tests
      run: dotnet test SharpAssert.sln --configuration Release --no-build
    
    - name: Create packages
      run: |
        mkdir -p ./packages
        dotnet pack src/SharpAssert.Runtime/SharpAssert.Runtime.csproj \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}
        dotnet pack src/SharpAssert/SharpAssert.csproj \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}
    
    - name: Verify packages
      run: |
        echo "Created packages:"
        ls -la ./packages/
        echo "Package count: $(ls ./packages/*.nupkg | wc -l)"
    
    - name: Test packages locally
      run: |
        # Create temporary local feed for testing
        mkdir -p test-feed
        cp ./packages/*.nupkg test-feed/
        echo "Testing packages in test-feed:"
        ls -la test-feed/
    
    - name: Get temporary NuGet API key
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: yevhen

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push ./packages/SharpAssert.Runtime.*.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

        dotnet nuget push ./packages/SharpAssert.[0-9]*.nupkg \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Check if release exists
      id: check_release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "v${{ steps.get_version.outputs.VERSION }}" &>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.get_version.outputs.VERSION }} already exists, skipping creation"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      if: steps.check_release.outputs.exists != 'true'
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        generate_release_notes: true